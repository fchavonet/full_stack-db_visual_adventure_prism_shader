<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dragon Ball Visual Adventure Prism Shader</title>
    <meta name="description" content="An open-source WebGL tool for recreating and calibrating the prism effect of Dragon Ball Visual Adventure cards for community-driven tools and applications.">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Script -->
    <script src="./script.js" defer></script>
</head>

<body class="w-full min-h-screen p-2 flex flex-col justify-center items-center text-xs text-slate-900">
    <div class="w-full max-w-7xl">

        <main class="grid grid-cols-1 xl:grid-cols-[260px_600px_300px] justify-center items-stretch gap-4">
            <!-- Card -->
            <section class="order-2 xl:order-1 flex flex-col border border-slate-300 rounded-lg">
                <h2 class="w-full px-2 py-2 text-lg font-bold text-center border-b border-slate-300">
                    Card
                </h2>

                <div class="p-3 flex flex-col gap-4">
                    <div class="p-3 flex flex-col gap-2">
                        <div class="flex flex-col">
                            <label for="partSelect">
                                Select a part:
                            </label>

                            <select id="partSelect" class="p-1 font-mono rounded bg-slate-100 disabled:text-slate-300 cursor-pointer disabled:cursor-not-allowed" disabled>
                                <option value="">
                                    Loading parts...
                                </option>
                            </select>
                        </div>

                        <div class="flex flex-col">
                            <label for="cardSelect">
                                Select a card:
                            </label>

                            <select id="cardSelect" class="p-1 font-mono rounded bg-slate-100 disabled:text-slate-300 cursor-pointer disabled:cursor-not-allowed" disabled>
                                <option value="">
                                    Choose a part first
                                </option>
                            </select>


                        </div>
                    </div>

                    <div>
                        <div class="mb-1 flex justify-between items-center">
                            <span class="font-bold">
                                Prism mask
                            </span>

                            <button id="clearMaskButton" class="text-sky-700 disabled:text-slate-300 cursor-pointer disabled:cursor-not-allowed" type="button" disabled>
                                Remove
                            </button>
                        </div>

                        <label for="maskInput" class="block p-3 border border-dashed border-slate-300 hover:border-sky-700 rounded-lg cursor-pointer">
                            <p class="font-bold">
                                Import mask
                            </p>

                            <p id="maskFileName" class="text-slate-500">
                                No mask loaded
                            </p>

                            <p class="mt-1 text-[10px] text-slate-400">
                                Black = none • White = Prism
                            </p>

                            <input id="maskInput" class="hidden" type="file" accept="image/png,image/jpeg,image/webp">
                        </label>
                    </div>
                </div>
            </section>

            <!-- Preview -->
            <section class="order-1 xl:order-2 flex flex-col border border-slate-300 rounded-lg">
                <h1 class="w-full px-2 py-2 text-lg lg:text-2xl font-bold text-center border-b border-slate-300">
                    Dragon Ball Visual Adventure Prism Shader
                </h1>

                <div id="stage" class="min-h-[470px] p-4 flex justify-center items-center">
                    <p id="previewMessage" class="text-slate-500">
                        Loading card...
                    </p>

                    <canvas id="glCanvas" class="hidden w-full max-w-[280px] h-auto"></canvas>
                </div>
            </section>

            <!-- Settings -->
            <section class="order-3 flex flex-col border border-slate-300 rounded-lg">
                <h2 class="w-full px-2 py-2 text-lg font-bold text-center border-b border-slate-300">
                    Settings
                </h2>

                <div class="p-3 flex flex-col gap-4">

                    <!-- Prism geometry -->
                    <div>
                        <h3 class="mb-2 font-bold">
                            Prism geometry
                        </h3>

                        <div class="flex flex-col gap-2">
                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="cellSize">Square size</label>
                                    <output id="cellSizeValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="cellSize" class="w-full accent-sky-700" type="range" min="60" max="260" step="1" value="150">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="gridOffsetX">Grid offset X</label>
                                    <output id="gridOffsetXValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="gridOffsetX" class="w-full accent-sky-700" type="range" min="-300" max="400" step="1" value="190">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="gridOffsetY">Grid offset Y</label>
                                    <output id="gridOffsetYValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="gridOffsetY" class="w-full accent-sky-700" type="range" min="-300" max="400" step="1" value="180">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="facetSlope">Facet relief</label>
                                    <output id="facetSlopeValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="facetSlope" class="w-full accent-sky-700" type="range" min="0.05" max="0.9" step="0.01" value="0.50">
                            </div>
                        </div>
                    </div>

                    <hr class="border-slate-200">

                    <!-- Optical response -->
                    <div>
                        <h3 class="mb-2 font-bold">
                            Optical response
                        </h3>

                        <div class="flex flex-col gap-2">
                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="intensity">Reflection intensity</label>
                                    <output id="intensityValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="intensity" class="w-full accent-sky-700" type="range" min="0" max="2" step="0.01" value="0.95">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="saturation">Prismatic colors</label>
                                    <output id="saturationValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="saturation" class="w-full accent-sky-700" type="range" min="0" max="1.5" step="0.01" value="0.60">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="gloss">Flash sharpness</label>
                                    <output id="glossValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="gloss" class="w-full accent-sky-700" type="range" min="6" max="120" step="1" value="35">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="silverFlash">Silver / white flash</label>
                                    <output id="silverFlashValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="silverFlash" class="w-full accent-sky-700" type="range" min="0" max="1.2" step="0.01" value="0.35">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="broadReflection">Broad reflection</label>
                                    <output id="broadReflectionValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="broadReflection" class="w-full accent-sky-700" type="range" min="0" max="1.2" step="0.01" value="0.35">
                            </div>
                        </div>
                    </div>

                    <hr class="border-slate-200">

                    <!-- Motion -->
                    <div>
                        <h3 class="mb-2 font-bold">
                            Motion
                        </h3>

                        <div class="flex flex-col gap-2">
                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="motionAmplitude">Motion amplitude</label>
                                    <output id="motionAmplitudeValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="motionAmplitude" class="w-full accent-sky-700" type="range" min="0" max="1.5" step="0.01" value="1">
                            </div>

                            <div>
                                <div class="flex justify-between gap-2">
                                    <label for="smoothing">Motion smoothing</label>
                                    <output id="smoothingValue" class="font-mono text-sky-700"></output>
                                </div>

                                <input id="smoothing" class="w-full accent-sky-700" type="range" min="0.01" max="0.25" step="0.005" value="0.075">
                            </div>
                        </div>

                        <label class="mt-2 flex items-center gap-2 cursor-pointer">
                            <input id="motionEnabled" type="checkbox" class="accent-sky-700" checked>
                            Enable motion
                        </label>
                    </div>

                </div>
            </section>

        </main>

        <footer>
            <p class="mt-2 px-4 text-center">
                This project is for educational and non-commercial purposes only.
                Dragon Ball and related characters are trademarks of <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Akira_Toriyama" target="_blank">Akira Toriyama</a>, <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Bandai" target="_blank">Bandai</a> and <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Toei_Animation" target="_blank">Toei Animation</a>.
            </p>
        </footer>

    </div>
</body>

</html>
