<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dragon Ball Visual Adventure Prism Shader</title>
    <meta name="description" content="An open-source WebGL tool for recreating and calibrating the prism effect of Dragon Ball Visual Adventure cards for community-driven tools and applications.">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Script -->
    <script src="./script.js" defer></script>
</head>

<body class="w-full min-h-screen p-2 flex flex-col justify-center items-center text-xs text-slate-900">
    <div class="w-full max-w-6xl">

        <main class="grid grid-cols-1 xl:grid-cols-[260px_600px_300px] justify-center items-stretch gap-4">
            <!-- Card -->
            <section class="order-2 lg:order-1 flex flex-col border border-slate-300 rounded-lg">
                <h2 class="w-full px-2 py-2 text-lg font-bold text-center border-b border-slate-300">
                    Card
                </h2>

                <div class="p-3">
                    Card controls
                </div>
            </section>

            <!-- Preview -->
            <section class="order-1 lg:order-2 flex flex-col border border-slate-300 rounded-lg">
                <h1 class="w-full px-2 py-2 text-lg lg:text-2xl font-bold text-center border-b border-slate-300">
                    Dragon Ball Visual Adventure Prism Shader
                </h1>

                <div class="min-h-96 p-4 flex justify-center items-center">
                    Prism Shader
                </div>
            </section>

            <!-- Settings -->
            <section class="order-3 flex flex-col border border-slate-300 rounded-lg">
                <h2 class="w-full px-2 py-2 text-lg font-bold text-center border-b border-slate-300">
                    Settings
                </h2>

                <div class="p-3">
                    Prism settings
                </div>
            </section>

        </main>

        <footer>
            <p class="mt-2 px-4 text-center">
                This API is for educational and non-commercial purposes only.
                Dragon Ball and related characters are trademarks of <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Akira_Toriyama" target="_blank">Akira Toriyama</a>, <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Bandai" target="_blank">Bandai</a> and <a class="text-sky-700" href="https://fr.wikipedia.org/wiki/Toei_Animation" target="_blank">Toei Animation</a>.
            </p>
        </footer>

    </div>
</body>

</html>
